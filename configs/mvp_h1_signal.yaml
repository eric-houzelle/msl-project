name: h1_signal
output: runs

data:
  min_k: 2
  max_k: 32
  tasks_per_state: 1
  n_views: 2

codec:
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_z: 64
  n_slots: 4
  quantizer_kind: pq
  n_codebooks: 8
  codebook_size: 1024
  w_reconstruction: 0.3
  w_alignment: 0.2
  w_bits: 0.0001
  w_commit: 1.0
  dropout: 0.0

train:
  dataset_size: 8192
  batch_size: 64
  steps: 1500
  warmup: 300
  lr: 0.0003
  log_every: 100
  precompute: true
  num_workers: 0
